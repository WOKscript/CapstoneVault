{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="trends-page">

  <style>
    /* Header panel (matches admin/user headers) */
    .trends-header-panel {
      background: var(--bg-primary);
      border-radius: .75rem;
      padding: 1rem 1.25rem;
      border: 1px solid #eef1f4;
      border-left: 4px solid var(--evsu-crimson);
      box-shadow: var(--shadow-sm);
      margin-bottom: 1rem;
    }

    .trends-header-panel h3 {
      letter-spacing: .2px;
    }

    /* Cards styling */
    .trends-page .card {
      border-radius: .75rem;
      border: 1px solid #eef1f4;
      box-shadow: var(--shadow-sm);
    }

    .chart-wrap { width: 100%; }
    #chartYearly     { min-height: 320px; }
    #chartStacked    { min-height: 360px; }
    #chartTopPapers  { min-height: 380px; }
  </style>

  <!-- Header -->
  <div class="trends-header-panel d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <h3 class="mb-1 fw-bold text-primary">Research Trends</h3>
      <p class="text-muted small mb-0">
        Visual analytics of CapstoneVault research output and access patterns
      </p>
    </div>
    <span class="text-muted small">Visible to all logged-in users</span>
  </div>

  <!-- Papers per Year (PIE) -->
  <div class="card mb-3">
    <div class="card-body">
      <h6 class="card-title mb-3 fw-semibold">Papers per Year</h6>
      <div id="chartYearly" class="chart-wrap"></div>
    </div>
  </div>

  <!-- Papers by Category (LINE) -->
  <div class="card mb-3">
    <div class="card-body">
      <h6 class="card-title mb-3 fw-semibold">Papers by Category (Line by Year)</h6>
      <div id="chartStacked" class="chart-wrap"></div>
    </div>
  </div>

  <!-- Most Accessed Papers (BAR CHART) -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <h6 class="mb-0 fw-semibold">Most Accessed Papers (by School Year)</h6>

        <div class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 small text-muted">School Year</label>
          <select id="aySelect" class="form-select form-select-sm"></select>
        </div>
      </div>
      <div id="chartTopPapers" class="chart-wrap"></div>
    </div>
  </div>
</div>

<!-- ApexCharts -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script>
(function () {
  // EVSU-themed palette (crimson + supporting colors)
  const palette = [
    "#b80a0a", // EVSU crimson
    "#8b0000", // dark crimson
    "#eab308", // gold
    "#0d9488", // teal
    "#1d4ed8", // blue
    "#64748b", // slate
    "#059669", // green
    "#f97316"  // orange
  ];

  async function fetchJSON(url) {
    const res = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  // ---- AY selector ----
  const AY_START = 8;
  const AY_YEARS_AHEAD = 5;

  function ayFor(d) {
    const y = d.getFullYear(), m = d.getMonth() + 1;
    return m >= AY_START ? `${y}-${y+1}` : `${y-1}-${y}`;
  }

  function ayStartYear(ayString) {
    return parseInt(ayString.slice(0, 4), 10);
  }

  const aySelect = document.getElementById("aySelect");
  const nowAY = ayFor(new Date());
  const startYear = ayStartYear(nowAY);

  const ayList = [];
  for (let i = 0; i < AY_YEARS_AHEAD; i++) {
    ayList.push(`${startYear + i}-${startYear + i + 1}`);
  }

  ayList.forEach(ay => {
    const option = document.createElement("option");
    option.value = ay;
    option.textContent = ay;
    if (ay === nowAY) option.selected = true;
    aySelect.appendChild(option);
  });

  // ---- Charts ----
  let chartYearlyPie = null;
  let chartCategoryLine = null;
  let chartTopPapers = null;

  // Load yearly & category trends
  fetchJSON("{% url 'trends_api' %}")
    .then(data => {
      chartYearlyPie = new ApexCharts(document.querySelector("#chartYearly"), {
        chart: { type: "pie", height: 320 },
        series: data.yearly.counts,
        labels: data.yearly.labels,
        legend: { position: "bottom" },
        colors: palette
      });
      chartYearlyPie.render();

      chartCategoryLine = new ApexCharts(document.querySelector("#chartStacked"), {
        chart: { type: "line", height: 360 },
        series: data.stackedByCategory.series,
        xaxis: { categories: data.stackedByCategory.labels },
        stroke: { curve: "smooth", width: 3 },
        markers: { size: 4 },
        legend: { position: "top" },
        colors: palette
      });
      chartCategoryLine.render();
    });

  // ===============================
  //      MOST ACCESSED (BAR)
  // ===============================

  const mountTop = document.getElementById('chartTopPapers');
  let reqToken = 0;

  function sanitizeTopPapers(rows) {
    if (!Array.isArray(rows)) return [];
    return rows.map(r => ({
      title: (r?.title ?? "").toString().trim() || "(Untitled)",
      views: Number(r?.views) || 0
    }));
  }

  function computeHeight(n) {
    return Math.max(320, Math.min(640, 70 * Math.max(n, 3)));
  }

  async function loadAY(ay) {
    const myToken = ++reqToken;
    mountTop.innerHTML = `<div class="text-muted small">Loading ${ay}…</div>`;
    if (chartTopPapers) { chartTopPapers.destroy(); chartTopPapers = null; }

    try {
      const data = await fetchJSON(`{% url 'most_accessed_api' %}?ay=${ay}`);
      if (myToken !== reqToken) return;

      const papers = sanitizeTopPapers(data.topPapers);
      if (!papers.length) {
        mountTop.innerHTML = `<div class="text-muted small">No data for ${ay}.</div>`;
        return;
      }

      const labels = papers.map(p =>
        p.title.length > 30 ? p.title.slice(0, 30) + "…" : p.title
      );

      const values = papers.map(p => p.views);
      const height = computeHeight(papers.length);

      chartTopPapers = new ApexCharts(mountTop, {
        chart: { type: "bar", height },
        series: [{ name: "Views", data: values }],
        plotOptions: {
          bar: {
            horizontal: false,
            columnWidth: "45%",
            borderRadius: 6
          }
        },
        xaxis: {
          categories: labels,
          labels: { rotate: -45, style: { fontSize: "11px" } }
        },
        yaxis: { labels: { formatter: (v) => Math.round(v) } },
        tooltip: {
          y: { formatter: (v) => v },
          x: {
            formatter: (label, ctx) => papers[ctx.dataPointIndex].title
          }
        },
        colors: [palette[0]] // crimson for access bars
      });

      chartTopPapers.render();

    } catch (err) {
      mountTop.innerHTML = `<div class="text-danger small">Error loading ${ay}.</div>`;
    }
  }

  aySelect.addEventListener("change", () => loadAY(aySelect.value));
  loadAY(nowAY);

})();
</script>
{% endblock %}
