services:
  - type: web
    name: capstonevault
    env: python
    workingDir: backend
    buildCommand: |
      pip install -r ../requirements.txt
      python manage.py collectstatic --noinput --clear
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: capstonevault-db
          property: connectionString

databases:
  - name: capstonevault-db
    plan: free
