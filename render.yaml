services:
  - type: web
    name: capstonevault
    env: python

    buildCommand: |
      pip install -r requirements.txt
      python backend/manage.py collectstatic --noinput --clear

    startCommand: gunicorn backend.backend.wsgi:application --chdir backend

    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: backend.backend.settings
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: capstonevault-db
          property: connectionString

databases:
  - name: capstonevault-db
    plan: free
